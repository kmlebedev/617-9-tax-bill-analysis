name: Pages

on:
  push:
    branches: [main]
    paths:
      - "617-9_risks.md"
      - "617-9_graph.md"
      - "617-9_review_qwen.md"
      - "README.md"
      - "graphify-out/graph.html"
      - "pages/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "617-9_risks.md"
      - "617-9_graph.md"
      - "617-9_review_qwen.md"
      - "README.md"
      - "graphify-out/graph.html"
      - "pages/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.7.7

      - name: Prepare site
        run: |
          rm -rf .pages-site _site
          mkdir -p .pages-site
          cp 617-9_risks.md .pages-site/index.md
          cp 617-9_graph.md .pages-site/graph.md
          cp 617-9_review_qwen.md .pages-site/review.md
          cp README.md .pages-site/readme.md
          cp graphify-out/graph.html .pages-site/graph.html
          cp -R pages/* .pages-site/

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
